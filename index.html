    <meta name="theme-color" content="#f4f7fa" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the visitor's saved theme before first paint. Light is the default;
      // dark is used only after someone picks it with the theme toggle.
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("rtl-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {}
        var root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        root.style.colorScheme = theme;
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0c1e36");
      })();
    </script>
